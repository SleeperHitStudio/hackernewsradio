name: Deploy to Cloudflare

on:
  push:
    branches: [main]

concurrency:
  group: cloudflare-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Syntax-check worker modules
        run: for f in worker/*.mjs; do node --check "$f"; done
      - run: npm test
      - run: npm run build
        env:
          # Public client-side token (kept out of source per repo policy).
          VITE_POSTHOG_KEY: ${{ vars.POSTHOG_KEY }}
          VITE_POSTHOG_HOST: https://us.i.posthog.com
      - name: Apply D1 migrations
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: d1 migrations apply DB --remote
      - name: Gate new Workflow starts
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          expires_at=$(date -u -d '+6 hours' '+%Y-%m-%dT%H:%M:%SZ')
          gate=$(node --input-type=module -e '
            process.stdout.write(JSON.stringify({
              state: "locked",
              runId: process.env.GITHUB_RUN_ID,
              runAttempt: process.env.GITHUB_RUN_ATTEMPT,
              acquiredAt: new Date().toISOString(),
              expiresAt: process.argv[1],
            }))
          ' "$expires_at")
          npx wrangler d1 execute DB --remote --command \
            "INSERT INTO settings (key, value, updated_at)
             VALUES ('workflowDeployGate', '$gate', strftime('%Y-%m-%dT%H:%M:%fZ', 'now'))
             ON CONFLICT (key) DO UPDATE SET
               value = excluded.value,
               updated_at = excluded.updated_at"
      - name: Wait for every active Workflow instance
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          # Wrangler 4.110's help text omits `waiting` and `waitingForPause`,
          # but its status validator and the Workflows API accept both. Sleeps
          # report as `Waiting` and are not returned by the `running` filter.
          # A deploy while any non-terminal state exists can reset its Durable
          # Object, so this guard is independent of time-of-day.
          active_statuses=(queued running paused waiting waitingForPause)
          while true; do
            active=0
            for status in "${active_statuses[@]}"; do
              if ! instances=$(npx wrangler workflows instances list hnr-pipeline --status "$status" --per-page 1 2>&1); then
                printf '%s\n' "$instances" >&2
                exit 1
              fi
              if grep -Fq 'There are no instances' <<<"$instances"; then
                continue
              fi
              if grep -Eq 'Showing [1-9][0-9]* instance' <<<"$instances"; then
                echo "Workflow has an active ${status} instance."
                active=1
                continue
              fi
              printf 'Unrecognized Wrangler output; refusing an unsafe deploy:\n%s\n' "$instances" >&2
              exit 1
            done
            if (( active == 0 )); then
              echo 'No active Workflow instances; deployment may proceed.'
              break
            fi
            echo 'Workflow activity remains; checking again in 300s.'
            sleep 300
          done
      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: deploy
      - name: Stabilize deployed Worker
        shell: bash
        run: |
          sleep 120
          curl --fail --silent --show-error --retry 5 --retry-delay 5 \
            https://hnradio.net/api/health
      - name: Release Workflow deploy gate
        if: ${{ always() }}
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npx wrangler d1 execute DB --remote --command \
            "DELETE FROM settings
             WHERE key = 'workflowDeployGate'
               AND CAST(json_extract(value, '$.runId') AS TEXT) = '${GITHUB_RUN_ID}'"
